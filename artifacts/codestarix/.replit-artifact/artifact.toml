kind = "web"
previewPath = "/"
title = "Codestarix"
version = "1.0.0"
id = "artifacts/codestarix"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25269

[services.development]
run = "pnpm --filter @workspace/codestarix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codestarix", "run", "build" ]
publicDir = "artifacts/codestarix/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25269"
BASE_PATH = "/"
